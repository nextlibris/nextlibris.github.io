<!doctype html>
<html lang="it" data-look="nuovo" data-pal="bosco">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Next Libris · ci siamo spostati</title>
<link rel="icon" href="icons/next-libris-192.png">
<link rel="stylesheet" href="style.css">
<style>
/* pagina «Ci siamo spostati» (trasloco.js): stessi colori e pulsanti dell'app */
.tr{max-width:440px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 20px 32px;text-align:center}
.tr-ico{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 18px}
.tr h1{font:700 24px/1.2 var(--font-display);margin:0 0 6px}
.tr-url{margin:0 0 18px;color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.tr-txt{margin:0 0 22px;color:var(--ink)}
.tr .btn{display:block;width:100%;text-decoration:none;box-sizing:border-box}
</style>
</head>
<body>
<main class="tr">
  <img src="icons/next-libris-192.png" alt="" class="tr-ico">
  <h1>Ci siamo spostati</h1>
  <p class="tr-url">nextlibris.github.io</p>
  <p class="tr-txt">Next Libris adesso è solo su <b>nextlibris.github.io</b>. Una copia a un altro indirizzo non è nostra: non darle la tua chiave né i tuoi dati.</p>
  <a class="btn primary" id="trGo" href="https://nextlibris.github.io/">Apri Next Libris</a>
</main>
<script src="trasloco.js"></script>
</body>
</html>
